<h2>I blend <b>Design & Functionality</b><br>to create something awesome,<br> check my work below.</h2>
<div class="container" id="gallery"></div>

<script>
const gallery = document.getElementById("gallery");
let loading = false;
const category = "{{ page.category | default: 'all' }}";

// Ukuran masing-masing kategori
const categories = {
  design: [[1999,1452],[1931,1087]],
  branding: [[1887,2831],[1887,2831],[1964,2455]],
  identity: [[2070,1380],[2070,1380],[1887,2830]]
};

// Fungsi generate URL Picsum
function generatePicsum(w,h){
  return `https://picsum.photos/${w}/${h}?random=${Math.floor(Math.random()*10000)}`;
}

function loadImages(cat, count=1){
  if(loading) return;
  loading = true;
  let images = [];
  if(cat==="all"){
    images = Object.entries(categories).flatMap(([key,val])=>val.map(size=>({cat:key,size})));
  } else {
    images = categories[cat].map(size=>({cat,size}));
  }

  for(let i=0;i<count;i++){
    const randomSet = cat==="all"?images:images.map(x=>x);
    randomSet.forEach(item=>{
      const box=document.createElement("div");
      box.className=`box ${item.cat}`;
      const img=document.createElement("img");
      img.src=generatePicsum(item.size[0],item.size[1]);
      box.appendChild(img);
      gallery.appendChild(box);
    });
  }
  loading=false;
}

loadImages(category);

window.addEventListener("scroll",()=>{
  if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 300){
    loadImages(category);
  }
});
</script>
